name: Build Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Generate resources
        run: python3 -c "
          bash_script = open('tdp-manager.sh').read()
          daemon_script = open('auto-turbo-daemon.py').read()
          tui_script = open('tdp-manager-tui.py').read()
          code = '# Auto-generated\n\n'
          code += f'BASH_SCRIPT = {repr(bash_script)}\n\n'
          code += f'DAEMON_SCRIPT = {repr(daemon_script)}\n\n'
          code += f'TUI_SCRIPT = {repr(tui_script)}\n'
          open('predator_pkg/resources.py', 'w').write(code)
          "

      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --name predator-power
          --hidden-import predator_pkg
          --hidden-import predator_pkg.resources
          --collect-all predator_pkg
          predator-power.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/predator-power
